name: CI Workflow

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run simple check
        run: |
          echo "Запуск базовых проверок..."
          ls -la
          echo "Проверка завершена успешно!"
